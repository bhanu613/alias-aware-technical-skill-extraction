name: Reproduce final results

on:
  workflow_dispatch:
  push:
    paths:
      - "config/**"
      - "data/**"
      - "results/residual_error_decisions.csv"
      - "src/**"
      - "scripts/reproduce_results.py"
      - "requirements.txt"
      - ".github/workflows/reproduce-results.yml"

jobs:
  reproduce:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Reproduce final results
        run: python scripts/reproduce_results.py

      - name: Upload runtime outputs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: reproduced-runtime-outputs
          path: outputs/runtime/
          if-no-files-found: error
